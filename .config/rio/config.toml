# Converted from ~/.config/wezterm/wezterm.lua, checked against Rio 0.5.32.
# Top-level keys must stay above the first [section].

# Generated by ~/.config/scripts/fzf_theme.sh from ~/.config/custom-themes.
theme = "current"

confirm-before-quit = false
draw-bold-text-with-light-colors = true
line-height = 1.1
scrollback-history-limit = 100000

# top, right, bottom, left. The site documents this key as `padding`; 0.5.32 reads `margin`.
margin = [4, 12, 0, 12]

[panel]
margin = [0]
padding = [0]

[shell]
program = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~"]

[fonts]
family = "Berkeley Mono"
# Rio sizes are in pixels: wezterm's 15pt is 20px at 96 dpi.
size = 20
hinting = false
features = ["zero", "calt", "clig"]
# Rio has no ordered fallback list, so pin the Nerd Font ranges to the symbols font.
symbol-map = [
  { start = "23FB", end = "23FE", font-family = "Symbols Nerd Font" },
  { start = "2B58", end = "2B58", font-family = "Symbols Nerd Font" },
  { start = "E000", end = "E00A", font-family = "Symbols Nerd Font" },
  { start = "E0A0", end = "E0D7", font-family = "Symbols Nerd Font" },
  { start = "E200", end = "E2A9", font-family = "Symbols Nerd Font" },
  { start = "E300", end = "E3E3", font-family = "Symbols Nerd Font" },
  { start = "E5FA", end = "E6BB", font-family = "Symbols Nerd Font" },
  { start = "E700", end = "E958", font-family = "Symbols Nerd Font" },
  { start = "EA60", end = "EC84", font-family = "Symbols Nerd Font" },
  { start = "ED00", end = "F385", font-family = "Symbols Nerd Font" },
  { start = "F400", end = "F533", font-family = "Symbols Nerd Font" },
  { start = "F0001", end = "F1AF0", font-family = "Symbols Nerd Font" },
]

# Berkeley Mono's obliques carry no italic flag, so Rio would slant them a second time.
# Naming a style turns that fake slant off; the oblique file is still the one picked.
[fonts.italic]
style = "Oblique"

[fonts.bold-italic]
style = "Bold Oblique"

[navigation]
hide-if-single = true

# Background gradient, disabled for now. Uncomment the three lines to bring it back.
# "game" renders continuously so the gradient keeps moving; the shader is deployed by
# fzf_theme.sh from ~/.config/rio/shaders/gradient_warp.slang.
# [renderer]
# strategy = "game"
# filters = ['C:\Users\Le_Bu\AppData\Local\rio\shaders\gradient_warp.slangp']

# Stands in for ghostty's cursor_neovide.glsl: leading corners snap, trailing ones lag.
[effects]
trail-cursor = true
trail-cursor-decay = [1, 400]

# Ctrl+click opens links (Rio's default modifier on Windows is Alt).
[[hints.rules]]
regex = '(?:https?://|mailto:|ftp://|file:|ssh:|git://|ssh://|tel:|magnet:|ipfs://|ipns://|gemini://|gopher://|news:)(?:(?:\[[:0-9a-fA-F]+(?:[:0-9a-fA-F]*)+\](?::[0-9]+)?)|[\w\-.~:/?#@!$&*+,;=%]+(?:[\(\[]\w*[\)\]])?)+(?<![,.])'
hyperlinks = true
action = "Open"

[hints.rules.mouse]
mods = ["Control"]

[hints.rules.binding]
key = "O"
mods = ["Control", "Shift"]
