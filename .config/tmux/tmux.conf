set -g default-shell /usr/bin/zsh
set -g default-terminal "wezterm"
set -as terminal-features ",*:RGB,xterm-256color:usstyle"

set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -g allow-passthrough on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g aggressive-resize on
set -g detach-on-destroy off
set -g bell-action none
set -g display-panes-time 800
set -g display-time 4000
set -g status-interval 5

set-hook -g session-created {
    if -F '#{==:#{session_name},0}' { rename-session -t 0 'Main Session' }
}

source "$HOME/.config/tmux/conf/current_theme.conf"
source "$HOME/.config/tmux/conf/theme.conf"
source "$HOME/.config/tmux/conf/keys.conf"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rachartier/tiny-weather'
set -g @plugin 'Morantron/tmux-fingers'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @extrakto_fzf_unset_default_opts false

set -g @ssh-split-keep-cwd true
set -g @ssh-split-keep-remote-cwd true
set -g @ssh-split-strip-cmd true
set -g @ssh-split-h-key H
set -g @ssh-split-v-key V

set -g @vim_navigator_mapping_left 'C-h M-h M-Left'
set -g @vim_navigator_mapping_down 'C-j M-j M-Down'
set -g @vim_navigator_mapping_up 'C-k M-k M-Up'
set -g @vim_navigator_mapping_right 'C-l M-l M-Right'

set -g @tinyweather-cache-duration 60
set -g @tinyweather-lat "45.77640064756136"
set -g @tinyweather-lon "3.0821210347472676"

set -g @fingers-hint-style 'fg=black,bg=blue,bold'
set -g @fingers-highlight-style 'fg=white'
set -g @fingers-backdrop-style 'fg=colour8'
set -g @fingers-keyboard-layout azerty
set -g @fingers-pattern-0 '([a-zA-Z0-9-_]+\.[a-zA-Z0-9]+)(?:\s|$)'
# file:line:col from compiler/test output; also covers localhost:3000 and 127.0.0.1:8080
set -g @fingers-pattern-1 '(?<match>[\w./-]+:\d+(:\d+)?)'
set -g @fingers-pattern-2 '^[A-Z0-9_]+=(?<match>.*)'
set -g @fingers-pattern-3 '"(?<match>[^"]+)"'
set -g @fingers-pattern-4 'git push --set-upstream .*'

run '~/.config/tmux/plugins/tpm/tpm'
