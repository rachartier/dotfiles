set -g @tinyweather-color-sunny "$COLOR_yellow"
set -g @tinyweather-color-snowy "$COLOR_text"
set -g @tinyweather-color-cloudy "$COLOR_text"
set -g @tinyweather-color-stormy "$COLOR_peach"
set -g @tinyweather-color-rainny "$COLOR_blue"
set -g @tinyweather-color-default "$COLOR_text"

set -g status-position top
set -g status-style "bg=$COLOR_base"
set -g status-left-length 110
set -g status-right-length 90
set -g status-left "#[fg=$COLOR_mauve]󰁥  #[fg=$COLOR_text,bold]#S#[fg=$COLOR_muted,nobold]  | "
set -g status-right "#[fg=$COLOR_muted] #{tinyweather}"

set -g window-status-separator "   "
set -g window-status-current-format "#{?window_bell_flag,#[fg=$COLOR_muted]#[default],#[fg=$COLOR_muted] }#[fg=$COLOR_green]  #[fg=$COLOR_text]#{b:pane_current_path} #{?window_zoomed_flag,, } "
set -g window-status-format "#{?window_bell_flag,#[fg=$COLOR_flamingo] ,   }#[fg=$COLOR_subtle] #{b:pane_current_path}   "
set -g window-status-bell-style default
set -g window-status-activity-style default

set -g message-style "bg=$COLOR_blue,fg=$COLOR_base"
set -g mode-style "bg=$COLOR_mantle,fg=$COLOR_subtle,reverse"

set -g window-style "bg=$COLOR_mantle"
set -g window-active-style "fg=$COLOR_text,bg=$COLOR_base"

set -g pane-active-border-style "fg=$COLOR_highlight"
set -g pane-border-style "fg=$COLOR_surface"
set -g pane-border-lines heavy

# set -g pane-border-status false
# set -g pane-border-format ""
set -g pane-scrollbars modal

set -g popup-border-lines rounded
set -g menu-border-lines rounded
