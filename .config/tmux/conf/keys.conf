unbind C-b
set -g prefix ²
bind ² send-prefix

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -n M-V split-window -v -c "#{pane_current_path}"
bind -n M-H split-window -h -c "#{pane_current_path}"
bind -n M-f resize-pane -Z
bind -n M-X kill-pane

bind -n M-s display-popup -E "$HOME/.config/scripts/fzf_session.sh"
bind -n M-P display-popup -E "$HOME/.config/scripts/projects.sh"
bind -n M-S display-popup -E "$HOME/.config/scripts/fzf_ssh_host.sh"
bind -n M-t display-popup -E "$HOME/.config/scripts/fzf_theme.sh"
bind -n M-i display-popup -E "$HOME/.config/scripts/set_ip.sh"
bind -n M-D display-popup -E "$HOME/.config/scripts/devcontainer-projects.sh"

bind -n M-g display-popup -d '#{pane_current_path}' -E -w 90% -h 90% "TMUX_NEOGIT_POPUP=1 nvim -c 'lua require(\"neogit\").open({ kind = \"replace\" })'"
bind -n M-G display-popup -d '#{pane_current_path}' -E -w 90% -h 90% "TMUX_NEOGIT_POPUP=1 GIT_DIR=$HOME/.cfg GIT_WORK_TREE=$HOME nvim -c 'lua require(\"neogit\").open({ kind = \"replace\" })'"
bind -n M-b display-popup -d '#{pane_current_path}' -E -w 90% -h 90% glab-tui
bind -n M-d display-popup -E -w 90% -h 90% lazydocker

bind -n C-f run-shell -b "#{@fingers-cli} start #{pane_id}"

bind k confirm-before kill-window
bind K confirm-before kill-server
bind < resize-pane -L 5
bind > resize-pane -R 5
bind - resize-pane -D 5
bind + resize-pane -U 5
bind . command-prompt
bind a last-window
bind Space command-prompt -p index select-window
bind r source-file "$HOME/.config/tmux/tmux.conf"
